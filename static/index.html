<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI 求职助手</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);color:#fff;padding:40px 24px 36px;text-align:center}
.header h1{font-size:32px;font-weight:700}
.header h1 span{background:linear-gradient(135deg,#818cf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{margin-top:8px;font-size:14px;color:#94a3b8}
.container{max-width:920px;margin:0 auto;padding:0 16px}
.input-section{margin-top:-16px;position:relative;z-index:2}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.input-grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:10px;padding:20px;border:1px solid #e2e8f0}
.card-label{font-size:13px;font-weight:600;color:#475569;margin-bottom:10px}
.upload-zone{border:2px dashed #cbd5e1;border-radius:8px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafc}
.upload-zone:hover,.upload-zone.dragover{border-color:#6366f1;background:#eef2ff}
.upload-zone.has-file{border-color:#22c55e;background:#f0fdf4}
.upload-text{font-size:13px;color:#64748b}
.upload-text strong{color:#6366f1}
.file-name{font-size:12px;color:#22c55e;margin-top:6px;display:none}
.file-name.show{display:block}
.upload-zone input[type=file]{display:none}
textarea{width:100%;min-height:160px;padding:12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;line-height:1.5;resize:vertical;background:#f8fafc}
textarea:focus{outline:none;border-color:#6366f1;background:#fff}
.target-role{margin-top:10px}
.target-role label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px}
.target-role input{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;background:#f8fafc}
.target-role input:focus{outline:none;border-color:#6366f1;background:#fff}
.target-role .hint{font-size:10px;color:#94a3b8;margin-top:5px;line-height:1.4}
.btn-wrapper{text-align:center;margin:20px 0}
.btn-analyze{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;padding:12px 48px;font-size:15px;font-weight:600;border-radius:10px;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,.3)}
.btn-analyze:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.4)}
.btn-analyze:disabled{opacity:.6;cursor:default;transform:none}
.loading{display:none;text-align:center;padding:32px 0}
.loading.show{display:block}
.spinner{width:36px;height:36px;margin:0 auto 12px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#64748b;font-size:13px}
.steps{display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:12px;color:#94a3b8}
.steps span{display:flex;align-items:center;gap:4px}
.steps .ok{color:#22c55e}.steps .on{color:#6366f1;font-weight:500}
.error{display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px 18px;margin:12px 0;color:#dc2626;font-size:13px}
.error.show{display:block}
.results{display:none;margin-top:8px}.results.show{display:block}
.score-card{background:linear-gradient(135deg,#1e293b,#334155);border-radius:12px;padding:24px;text-align:center;margin-bottom:20px}
.score-card .l{font-size:13px;color:#94a3b8}
.score-ring{display:inline-block;width:80px;height:80px;border-radius:50%;background:conic-gradient(#6366f1 var(--pct),#1e293b var(--pct));margin:8px auto;position:relative}
.score-ring div{position:absolute;inset:5px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center}
.score-ring div span{font-size:24px;font-weight:700;color:#fff}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.rg{grid-template-columns:1fr}}
.rc{background:#fff;border-radius:10px;padding:16px;border:1px solid #e2e8f0}
.rc h3{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f1f5f9}
.rc h3 b{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:500}
.ri{padding:8px 10px;margin-bottom:6px;border-radius:6px;background:#f8fafc;border-left:3px solid;font-size:12px;line-height:1.4}
.ri .lb{font-weight:600;color:#334155}
.ri .ds{color:#64748b}
.ri .tg{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;margin-top:2px;font-weight:500}
.t1{background:#fef2f2;color:#dc2626}.t2{background:#fffbeb;color:#d97706}.t3{background:#f0fdf4;color:#16a34a}
.t4{background:#f0fdf4;color:#16a34a}.t5{background:#fffbeb;color:#d97706}.t6{background:#fef2f2;color:#dc2626}
.s1 h3{color:#16a34a}.s1 .ri{border-left-color:#22c55e}
.s2 h3{color:#dc2626}.s2 .ri{border-left-color:#ef4444}
.s3 h3{color:#d97706}.s3 .ri{border-left-color:#f59e0b}
.s4 h3{color:#6366f1}.s4 .ri{border-left-color:#818cf8}
footer{text-align:center;padding:24px 20px;font-size:12px;color:#94a3b8}
.emp{text-align:center;padding:16px;color:#94a3b8;font-size:13px}
.dv{margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0;text-align:center;font-size:11px;color:#94a3b8}
.os{display:none;margin-top:8px;padding:8px;border-radius:6px;font-size:12px}
.op{display:none;margin-top:8px}
.op .bar{height:3px;background:#e2e8f0;border-radius:2px;overflow:hidden}
.op .bar div{height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#818cf8);border-radius:2px;transition:width .3s}
.op .t{font-size:11px;color:#64748b;margin-top:4px}
.rw{margin-top:20px}
.ro{display:none;margin-top:12px}
.rl{display:none;text-align:center;padding:20px}
.rbox{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.rhd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.rhd span{font-size:12px;font-weight:600;color:#475569}
.rhd div{display:flex;gap:6px}
.rhd button{background:none;border:1px solid #cbd5e1;border-radius:5px;padding:3px 10px;font-size:11px;color:#64748b;cursor:pointer}
.rhd button:hover{border-color:#6366f1;color:#6366f1}
.rhd .dw{background:#1e293b;border-color:#1e293b;color:#fff;border-radius:5px;padding:3px 12px;font-size:11px;cursor:pointer}
.rhd .dw:hover{background:#334155}
.rbd{padding:16px;font-size:12px;line-height:1.6;color:#334155;white-space:pre-wrap;font-family:inherit;max-height:480px;overflow-y:auto}
.bg{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;border:none;padding:8px 24px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer}
.bg:hover{transform:translateY(-1px)}
.bg:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>

<div class="header">
<div class="container">
<h1>AI <span>求职助手</span></h1>
<p>上传简历 · 匹配分析 · 简历优化</p>
</div>
</div>

<div class="container">
<div class="input-section">
<div class="input-grid">

<div class="card">
<div class="card-label">简历 (PDF)</div>
<div class="upload-zone" id="pdfZone">
<input type="file" id="pdfInput" accept=".pdf">
<div style="font-size:28px;margin-bottom:6px">+</div>
<div class="upload-text">拖拽简历到这里，或 <strong>点击选择</strong></div>
<div class="file-name" id="pdfName"></div>
</div>
</div>

<div class="card">
<div class="card-label">岗位描述</div>
<textarea id="jdInput" placeholder="粘贴 JD 文本到这里..."></textarea>
<div class="target-role">
<label for="targetRole">目标岗位名称（生成优化简历时必填）</label>
<input id="targetRole" maxlength="60" placeholder="例如：AI产品经理实习生">
<div class="hint">将明确替换简历中原有的求职方向，不会自动编造经历或数据。</div>
</div>
<div class="dv">或者截图上传（支持多张 / 微信拖拽）</div>
<div class="upload-zone" id="imgZone">
<input type="file" id="imgInput" accept="image/*" multiple>
<div style="font-size:22px;margin-bottom:4px">+</div>
<div class="upload-text">拖拽截图到这里，或 <strong>点击选择</strong></div>
<div class="file-name" id="imgName"></div>
</div>
<div class="op" id="ocrProg">
<div class="bar"><div id="ocrFill"></div></div>
<div class="t" id="ocrText"></div>
</div>
<div class="os" id="ocrStatus"></div>
</div>

</div>

<div class="btn-wrapper">
<button class="btn-analyze" id="btnAnalyze">分析</button>
</div>

<div class="loading" id="loading">
<div class="spinner"></div>
<div class="loading-text">AI 正在分析...</div>
<div class="steps">
<span id="s1">解析简历</span>
<span id="s2">AI 分析</span>
<span id="s3">生成报告</span>
</div>
</div>

<div class="error" id="errBox"></div>

<div class="results" id="results">
<div class="score-card">
<div class="l">综合匹配度</div>
<div class="score-ring" id="scoreRing">
<div><span id="scoreNum">--</span></div>
</div>
</div>
<div class="rg">
<div class="rc s1">
<h3>优势分析 <b id="sc1" style="background:#dcfce7;color:#16a34a"></b></h3>
<div id="lc1"><div class="emp">暂无数据</div></div>
</div>
<div class="rc s2">
<h3>技能缺口 <b id="sc2" style="background:#fef2f2;color:#dc2626"></b></h3>
<div id="lc2"><div class="emp">暂无数据</div></div>
</div>
<div class="rc s3">
<h3>简历修改建议 <b id="sc3" style="background:#fffbeb;color:#d97706"></b></h3>
<div id="lc3"><div class="emp">暂无数据</div></div>
</div>
<div class="rc s4">
<h3>面试问题预测 <b id="sc4" style="background:#eef2ff;color:#6366f1"></b></h3>
<div id="lc4"><div class="emp">暂无数据</div></div>
</div>
</div>
</div>

<div class="rw" id="rwSec">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
<button class="bg" id="btnRewrite">生成优化简历</button>
<span style="font-size:11px;color:#94a3b8">替换求职目标，并按 JD 重排经历与关键词</span>
</div>
<div class="rl" id="rwLoad"><div class="spinner"></div><div class="loading-text">正在优化简历...</div></div>
<div class="ro" id="rwOut">
<div class="rbox">
<div class="rhd">
<span id="rwTitle">优化后的简历</span>
<div>
<button onclick="copyResume()">复制</button>
<button class="dw" onclick="dlPDF('normal')">下载 PDF（保留照片）</button>
</div>
</div>
<div class="rbd" id="rwBody"></div>
</div>
</div>
</div>

</div>
</div>

<footer>AI 求职助手 · DeepSeek API · 个人作品集</footer>

<script>
// === PDF 上传 ===
const pz=document.getElementById('pdfZone'),pi=document.getElementById('pdfInput'),pn=document.getElementById('pdfName');
pz.addEventListener('click',()=>pi.click());
pz.addEventListener('dragover',e=>{e.preventDefault();pz.classList.add('dragover')});
pz.addEventListener('dragleave',()=>pz.classList.remove('dragover'));
pz.addEventListener('drop',e=>{e.preventDefault();pz.classList.remove('dragover');if(e.dataTransfer.files.length)loadPDF(e.dataTransfer.files[0])});
pi.addEventListener('change',e=>{if(e.target.files.length)loadPDF(e.target.files[0])});
function loadPDF(f){
  if(f.type!=='application/pdf'){alert('请上传 PDF 文件');return}
  if(f.size>10*1024*1024){alert('文件不能超过 10MB');return}
  pz.classList.add('has-file');pn.textContent=f.name+' ('+(f.size/1024).toFixed(1)+' KB)';pn.classList.add('show');pz._f=f;
}

// === OCR 截图识别 ===
const iz=document.getElementById('imgZone'),ii=document.getElementById('imgInput'),inm=document.getElementById('imgName');
const opb=document.getElementById('ocrProg'),ofl=document.getElementById('ocrFill'),otx=document.getElementById('ocrText');
const ost=document.getElementById('ocrStatus');
let busy=false,totalImg=0,allTxt=[];

iz.addEventListener('click',()=>{if(!busy)ii.click()});
iz.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();iz.classList.add('dragover')});
iz.addEventListener('dragleave',e=>{e.preventDefault();e.stopPropagation();iz.classList.remove('dragover')});
iz.addEventListener('drop',e=>{
  e.preventDefault();e.stopPropagation();iz.classList.remove('dragover');
  const fs=Array.from(e.dataTransfer.files).filter(x=>x.type.startsWith('image/'));
  if(fs.length)addImgs(fs);
});
ii.addEventListener('change',e=>{
  if(e.target.files.length){addImgs(Array.from(e.target.files).filter(x=>x.type.startsWith('image/')));ii.value=''}
});

function addImgs(fs){
  if(!fs.length)return;
  iz.classList.add('has-file');inm.classList.add('show');ost.style.display='none';opb.style.display='block';
  runOCR(fs);
}
async function runOCR(fs,idx){
  if(idx===undefined)idx=0;
  if(!fs[idx]){ocrDone();return}
  busy=true;
  const f=fs[idx],seq=totalImg+1;
  inm.textContent='['+seq+'] '+f.name;
  ofl.style.width=((idx/fs.length)*80)+'%';
  otx.textContent='识别中 ('+seq+')...';
  ost.style.display='none';
  try{
    const du=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
    ofl.style.width=(((idx+.1)/fs.length)*80)+'%';
    otx.textContent='第 '+seq+' 张：识别中...';
    const res=await Tesseract.recognize(du,'chi_sim+eng',{
      logger:m=>{if(m.status==='recognizing text'){ofl.style.width=Math.min((idx/fs.length)*80+(m.progress*15/fs.length),85)+'%'}}
    });
    const t=res.data.text.trim();
    if(t){allTxt.push(t);totalImg++;ofl.style.width=(((idx+.9)/fs.length)*80)+'%';otx.textContent='完成 ('+seq+') '+t.length+' 字'}
    else otx.textContent='跳过 ('+seq+') 未识别到文字';
  }catch(e){otx.textContent='失败 ('+seq+') '+e.message.substring(0,30)}
  document.getElementById('jdInput').value=allTxt.join('\n\n---\n\n');
  await new Promise(r=>setTimeout(r,100));
  if(idx+1<fs.length)await runOCR(fs,idx+1);else ocrDone();
}
function ocrDone(){
  const v=document.getElementById('jdInput').value,tc=v.length;
  ofl.style.width='100%';otx.textContent='完成！共 '+totalImg+' 张，'+tc+' 字';
  if(tc<20){ost.style.display='block';ost.style.background='#fffbeb';ost.style.color='#d97706';ost.style.border='1px solid #fde68a';ost.textContent='识别文字较少，请检查截图是否清晰'}
  else{ost.style.display='block';ost.style.background='#f0fdf4';ost.style.color='#16a34a';ost.style.border='1px solid #bbf7d0';ost.textContent=totalImg+' 张截图，'+tc+' 字。可继续添加'}
  busy=false;document.getElementById('jdInput').focus();
  setTimeout(()=>{opb.style.display='none';inm.textContent='已识别 '+totalImg+' 张，可继续添加'},4000);
}

// === 分析 ===
document.getElementById('btnAnalyze').addEventListener('click',analyze);
async function analyze(){
  const f=pz._f,jd=document.getElementById('jdInput').value.trim();
  if(!f){alert('请上传简历');return}
  if(!jd){alert('请输入岗位描述');return}
  document.getElementById('errBox').classList.remove('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('btnAnalyze').disabled=true;
  document.getElementById('loading').classList.add('show');
  document.getElementById('s1').className='on';
  const fd=new FormData();fd.append('resume',f);fd.append('jd_text',jd);
  try{
    await new Promise(r=>setTimeout(r,500));
    document.getElementById('s1').className='ok';document.getElementById('s2').className='on';
    const res=await fetch('/analyze',{method:'POST',body:fd});
    document.getElementById('s2').className='ok';document.getElementById('s3').className='on';
    if(!res.ok){const e=await res.json();throw new Error(e.detail||'分析失败')}
    const d=await res.json();
    await new Promise(r=>setTimeout(r,300));
    document.getElementById('s3').className='ok';await new Promise(r=>setTimeout(r,300));
    showRes(d);
  }catch(e){
    const el=document.getElementById('errBox');el.textContent=e.message||'错误';el.classList.add('show');
  }finally{
    document.getElementById('btnAnalyze').disabled=false;document.getElementById('loading').classList.remove('show');
  }
}
function showRes(d){
  const sc=d.overall_score||0;
  document.getElementById('scoreNum').textContent=sc;
  document.getElementById('scoreRing').style.setProperty('--pct',sc+'%');
  function rd(list,id){
    const el=document.getElementById(id);
    if(!list||!list.length){el.innerHTML='<div class="emp">暂无数据</div>';return}
    el.innerHTML=list.map(i=>{
      let h='<div class="ri">';
      if(i.point)h+='<div class="lb">'+esc(i.point)+'</div>';
      if(i.detail)h+='<div class="ds">'+esc(i.detail)+'</div>';
      if(i.skill)h+='<div class="lb">'+esc(i.skill)+'</div>';
      if(i.current_status)h+='<div class="ds">现状：'+esc(i.current_status)+'</div>';
      if(i.improvement_suggestion)h+='<div class="ds">建议：'+esc(i.improvement_suggestion)+'</div>';
      if(i.importance){const c={'高':'t1','中':'t2','低':'t3'}[i.importance];h+='<span class="tg '+c+'">'+i.importance+' 优先级</span>'}
      if(i.section)h+='<div class="lb">'+esc(i.section)+'</div>';
      if(i.issue)h+='<div class="ds">问题：'+esc(i.issue)+'</div>';
      if(i.rewrite_suggestion)h+='<div class="ds">建议：'+esc(i.rewrite_suggestion)+'</div>';
      if(i.question)h+='<div class="lb">'+esc(i.question)+'</div>';
      if(i.intent)h+='<div class="ds">考察点：'+esc(i.intent)+'</div>';
      if(i.difficulty){const c={'简单':'t4','中等':'t5','困难':'t6'}[i.difficulty];h+='<span class="tg '+c+'">'+i.difficulty+'</span>'}
      return h+'</div>'
    }).join('');
  }
  rd(d.strengths,'lc1');rd(d.skill_gaps,'lc2');rd(d.resume_tips,'lc3');rd(d.interview_questions,'lc4');
  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}
function esc(t){if(!t)return '';const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function stripMD(t){return t.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*]+)\*/g,'$1').replace(/__([^_]+)__/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/```[\s\S]*?```/g,'').replace(/~~~[\s\S]*?~~~/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim()}

// === 生成优化简历 ===
document.getElementById('btnRewrite').addEventListener('click',doRewrite);
async function doRewrite(){
  const f=pz._f,jd=document.getElementById('jdInput').value.trim(),role=document.getElementById('targetRole').value.trim();
  if(!f||!jd){alert('请先上传简历并输入岗位描述');return}
  if(!role){alert('请输入目标岗位名称，例如“AI产品经理实习生”');document.getElementById('targetRole').focus();return}
  document.getElementById('rwOut').style.display='none';
  document.getElementById('rwLoad').style.display='block';
  document.getElementById('btnRewrite').disabled=true;
  const fd=new FormData();fd.append('resume',f);fd.append('jd_text',jd);fd.append('target_role',role);
  try{
    const res=await fetch('/rewrite-resume',{method:'POST',body:fd});
    if(!res.ok){const e=await res.json();throw new Error(e.detail||'优化失败')}
    const d=await res.json();
    document.getElementById('rwBody').textContent=stripMD(d.rewritten_resume||'');
    document.getElementById('rwTitle').textContent='已针对「'+(d.target_role||role)+'」重写';
    document.getElementById('rwLoad').style.display='none';
    document.getElementById('rwOut').style.display='block';
    document.getElementById('rwSec').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    document.getElementById('rwLoad').style.display='none';
    document.getElementById('rwOut').style.display='block';
    document.getElementById('rwBody').textContent='错误：'+e.message;
  }finally{document.getElementById('btnRewrite').disabled=false}
}

// === 复制优化简历 ===
function copyResume(){
  const t=document.getElementById('rwBody').textContent;
  navigator.clipboard.writeText(t).then(()=>{
    const btns=document.querySelectorAll('.rhd button');
    const o=btns[0].textContent;btns[0].textContent='已复制';setTimeout(()=>btns[0].textContent=o,2000)
  });
}

// === 下载真正的 PDF；后端必须提取到原简历照片才会生成 ===
async function dlPDF(mode){
  const source=mode==='experimental'?'expBody':'rwBody';
  const t=document.getElementById(source).textContent;
  if(!t||!t.trim()){alert('请先生成优化简历');return}
  if(!pz._f){alert('原简历文件已失效，请重新上传，以便保留照片');return}
  const role=document.getElementById('targetRole').value.trim()||'目标岗位';
  const fd=new FormData();fd.append('resume',pz._f);fd.append('rewritten_resume',t);fd.append('target_role',role);
  try{
    const res=await fetch('/export-resume-pdf',{method:'POST',body:fd});
    if(!res.ok){const e=await res.json();throw new Error(e.detail||'PDF 生成失败')}
    const blob=await res.blob(),url=URL.createObjectURL(blob);
    const safeRole=role.replace(/[\\/:*?"<>|]/g,'_');
    const a=document.createElement('a');a.href=url;a.download=safeRole+(mode==='experimental'?'_实验草稿':'_针对性简历')+'.pdf';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){alert(e.message)}
}
</script>
