<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历管理 - AI求职助手</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">AI求职助手</span>
        </div>
        <div class="nav-menu">
            <a href="/" class="nav-link">首页</a>
            <a href="/pages/dashboard.html" class="nav-link">工作台</a>
            <a href="/pages/resume.html" class="nav-link active">简历管理</a>
            <a href="/pages/jobs.html" class="nav-link">职位搜索</a>
        </div>
        <div class="nav-auth" id="navAuth">
            <span class="user-info" id="userInfo" style="display:none"></span>
            <button class="btn btn-primary" onclick="showLogin()" id="loginBtn">登录</button>
            <button class="btn btn-outline" onclick="handleLogout()" id="logoutBtn" style="display:none">退出</button>
        </div>
    </nav>

    <main class="resume-page">
        <div class="page-header">
            <h1>简历管理</h1>
        </div>

        <!-- 拖拽上传区域 -->
        <div class="upload-zone" id="uploadZone">
            <div class="upload-zone-content" id="uploadZoneContent">
                <div class="upload-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <p class="upload-text">拖拽简历文件到此处，或 <span class="upload-link">点击选择文件</span></p>
                <p class="upload-hint">支持 PDF、Word（.doc/.docx）格式，最大 10MB</p>
            </div>
            <div class="upload-progress" id="uploadProgress" style="display:none">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">正在上传...</p>
            </div>
            <input type="file" id="resumeUpload" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none" onchange="handleResumeUpload(event)">
        </div>

        <!-- 简历列表 -->
        <div class="resume-list" id="resumeList">
            <div class="empty-state">
                <p>还没有上传简历</p>
                <p>支持 PDF、Word 格式</p>
            </div>
        </div>

        <!-- 简历详情 -->
        <div class="resume-detail" id="resumeDetail" style="display:none">
            <div class="detail-header">
                <div class="detail-header-left">
                    <button class="btn btn-text" onclick="backToResumeList()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                        返回列表
                    </button>
                    <h2 id="detailTitle">简历详情</h2>
                </div>
                <div class="detail-actions">
                    <button class="btn btn-primary" onclick="analyzeResume()">AI 分析</button>
                    <button class="btn btn-outline" onclick="optimizeResume()">AI 优化</button>
                </div>
            </div>
            <div class="detail-grid">
                <div class="detail-section">
                    <h3>基本信息</h3>
                    <div id="detailBasic"></div>
                </div>
                <div class="detail-section">
                    <h3>技能</h3>
                    <div id="detailSkills"></div>
                </div>
                <div class="detail-section">
                    <h3>工作经历</h3>
                    <div id="detailExperience"></div>
                </div>
                <div class="detail-section">
                    <h3>教育背景</h3>
                    <div id="detailEducation"></div>
                </div>
            </div>
            <div class="analysis-result" id="analysisResult" style="display:none">
                <h3>AI 分析报告</h3>
                <div id="analysisContent"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>AI求职助手 &copy; 2026</p>
    </footer>

    <!-- 登录/注册模态框 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('loginModal')">&times;</span>
            <h2>登录</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <div class="form-error" id="loginError"></div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
                <p class="form-footer">
                    还没有账号？<a href="#" onclick="showRegister(); return false;">立即注册</a>
                </p>
            </form>
        </div>
    </div>

    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('registerModal')">&times;</span>
            <h2>注册</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" required minlength="6">
                </div>
                <div class="form-error" id="registerError"></div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
                <p class="form-footer">
                    已有账号？<a href="#" onclick="showLogin(); return false;">去登录</a>
                </p>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
