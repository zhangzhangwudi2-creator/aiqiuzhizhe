<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 - AI求职助手</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">AI求职助手</span>
        </div>
        <div class="nav-menu">
            <a href="/" class="nav-link">首页</a>
            <a href="/pages/dashboard.html" class="nav-link active">工作台</a>
            <a href="/pages/resume.html" class="nav-link">简历管理</a>
            <a href="/pages/jobs.html" class="nav-link">职位搜索</a>
        </div>
        <div class="nav-auth" id="navAuth">
            <span class="user-info" id="userInfo" style="display:none"></span>
            <button class="btn btn-primary" onclick="showLogin()" id="loginBtn">登录</button>
            <button class="btn btn-outline" onclick="handleLogout()" id="logoutBtn" style="display:none">退出</button>
        </div>
    </nav>

    <main class="dashboard">
        <div class="dashboard-header">
            <h1>工作台</h1>
            <p>管理你的求职进度</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statResumes">0</div>
                <div class="stat-label">简历数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statJobs">0</div>
                <div class="stat-label">匹配职位</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statAvgScore">--</div>
                <div class="stat-label">平均评分</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statInterviews">0</div>
                <div class="stat-label">模拟面试</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h3>最近的简历</h3>
                <div id="recentResumes">
                    <p class="empty-state">暂无简历，去上传一份吧</p>
                </div>
            </div>
            <div class="dashboard-card">
                <h3>职位推荐</h3>
                <div id="jobRecommendations">
                    <p class="empty-state">上传简历后获取智能推荐</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>AI求职助手 &copy; 2026</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
